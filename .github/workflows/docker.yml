name: Docker

on:
  push:
    tags: ["v*"]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t uds:latest .
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag uds:latest ghcr.io/${{ github.repository_owner }}/uds:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository_owner }}/uds:${{ github.ref_name }}
